# Build + push the 8 prod app images, git-SHA tagged (spec terraform-and-cicd.md §4).
# On v* tag pushes this also chains the deploy (guard → deploy jobs below — spec
# tag-auto-deploy.md): commits on main auto-deploy to do-prod with mode=deploy-only.
# The repo owner wires the referenced secrets / AWS OIDC role and owns all commits.
# The image build happens inside Docker; pnpm/turbo run in the container, not on the runner.
name: build-images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects the registry)
        type: choice
        # aws-prod is PARKED (terraform authored, never provisioned) — re-add here AND to the
        # build matrix below when the AWS env stands up (plan 0560 item 7).
        options: [do-prod]
        required: true
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # AWS OIDC assume-role
      contents: read
    strategy:
      matrix:
        # aws-prod parked — its steps below stay wired but unreachable until re-added here.
        environment: [do-prod]
    # On manual dispatch, only build the chosen environment; on tag push, build both.
    steps:
      - name: Skip unselected environment (dispatch)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ matrix.environment }}" != "${{ inputs.environment }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v5

      - if: steps.gate.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      # ── DigitalOcean Container Registry ──
      - if: steps.gate.outputs.skip == 'false' && matrix.environment == 'do-prod'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - if: steps.gate.outputs.skip == 'false' && matrix.environment == 'do-prod'
        name: DOCR login + REGISTRY
        run: |
          doctl registry login --expiry-seconds 1200
          echo "REGISTRY=${{ secrets.DOCR_REGISTRY }}" >> "$GITHUB_ENV"   # registry.digitalocean.com/<name>

      # ── AWS Elastic Container Registry (OIDC, no static keys) ──
      - if: steps.gate.outputs.skip == 'false' && matrix.environment == 'aws-prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - if: steps.gate.outputs.skip == 'false' && matrix.environment == 'aws-prod'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.gate.outputs.skip == 'false' && matrix.environment == 'aws-prod'
        name: REGISTRY
        run: echo "REGISTRY=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_ENV"

      - if: steps.gate.outputs.skip == 'false'
        name: build + push (7 apps + fnb-n8n, git-SHA tag)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: infra/scripts/build-images.sh

  # ── v*-tag auto-deploy chain (spec tag-auto-deploy.md TD1/TD4) ──────────────
  # Tag pushes only — manual dispatch builds never chain into a deploy. Builds are harmless on
  # any commit (immutable SHA-tagged images); only commits on main may auto-deploy.
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history — the ancestry check needs origin/main
      - name: tagged commit must be on main (TD4)
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is on origin/main — proceeding to deploy"
          else
            echo "::error::tagged commit $GITHUB_SHA is NOT on origin/main — images stay pushed, deploy skipped"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    needs: [build, guard]
    permissions:
      id-token: write   # cap for the called workflow's jobs (reusable-workflow permission ceiling)
      contents: read
    # Repo-scoped group matching deploy.yml's dispatch group — serializes tag deploys against
    # manual deploys too (TD6: the called workflow's own workflow-level concurrency does not
    # bind runs made via workflow_call).
    concurrency:
      group: deploy-do-prod
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: do-prod            # aws-prod parked — extend when it stands up (plan 0560 item 7)
      image_tag: ${{ github.sha }}    # exactly the tag the build job pushed
      mode: deploy-only               # TD2 — the tag path never applies terraform
    secrets: inherit

query AdminSubscriptions(
  $tenantId: UUID!
) {
  adminSubscriptions: tenantSubscriptionsList(condition: {
    tenantId: $tenantId
  }) {
    ...TenantSubscription
    licensePack {
      ...LicensePack
      licensePackLicenseTypes: licensePackLicenseTypesByLicensePackKeyList {
        ...LicensePackLicenseType
        licenseType {
          ...LicenseType
        }
      }
    }
    licensesList {
      ...License
      resident {
        ...Resident
      }
    }
  }
}

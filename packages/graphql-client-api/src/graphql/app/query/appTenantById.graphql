query TenantById(
  $tenantId: UUID!
) {
  tenant(id: $tenantId) {
    ...Tenant
    residents: residentsList(orderBy: [CREATED_AT_ASC]) {
      ...Resident
      licenses: licensesList {
        id
        licenseTypeKey
        status
      }
    }
    tenantSubscriptions: tenantSubscriptionsList {
      ...TenantSubscription
      licensePack {
        displayName
      }
      licenses: licenses {
        totalCount
      }
    }
  }
}

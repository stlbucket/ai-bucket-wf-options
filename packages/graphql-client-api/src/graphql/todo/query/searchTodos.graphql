query SearchTodos(
  $searchTerm: String
  $todoType: TodoType
  $rootsOnly: Boolean
  $isTemplate: Boolean
  $assignedToResidentUrn: String
) {
   searchTodos (
    _options: {
      searchTerm: $searchTerm
      todoType: $todoType
      rootsOnly: $rootsOnly
      isTemplate: $isTemplate
      assignedToResidentUrn: $assignedToResidentUrn
  	}
  ){
    nodes {
      ...Todo
      assignees: todoAssigneesList {
        id
        residentUrn
        resourceByResidentUrn {
          resident {
            id
            displayName
          }
        }
      }
      parentTodo {
        ...Todo
      }
      tenant {
        id
        name
      }
    }
  }
}

query TodoById(
  $id: UUID!
) {
  todo(id: $id) {
    ...Todo
    assignees: todoAssigneesList {
      id
      residentUrn
      resourceByResidentUrn {
        resident {
          id
          displayName
        }
      }
    }
    parentTodo {
      id
      name
      parentTodo {
        id
        name
        parentTodo {
          id
          name
          parentTodo {
            id
            name
            parentTodo {
              id
              name
              parentTodo {
                id
                name
                parentTodo {
                  id
                  name
                  parentTodo {
                    id
                    name
                  }
                }
              }
            }
          }
        }
      }
    }
    children: todosByParentTodoIdList {
      ...Todo
      assignees: todoAssigneesList {
        id
        residentUrn
        resourceByResidentUrn {
          resident {
            id
            displayName
          }
        }
      }
      children: todosByParentTodoIdList {
        ...Todo
        assignees: todoAssigneesList {
          id
          residentUrn
          resourceByResidentUrn {
            resident {
              id
              displayName
            }
          }
        }
        children: todosByParentTodoIdList {
          ...Todo
          assignees: todoAssigneesList {
            id
            residentUrn
            resourceByResidentUrn {
              resident {
                id
                displayName
              }
            }
          }
          hiddenChildren: todosByParentTodoId {
            totalCount
          }
        }
      }
    }
  }
}
